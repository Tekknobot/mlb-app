<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2437" />

    <title>Slugline</title>

    <meta
      name="description"
      content="Slugline is a mobile-friendly baseball scoreboard, matchup tracker, team browser and player stat board powered by public MLB data."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph: WhatsApp, Bluesky, Facebook, Discord, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Slugline" />
    <meta property="og:title" content="Slugline" />
    <meta
      property="og:description"
      content="Scores, matchups, teams and player stats in one clean baseball dashboard."
    />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta
      property="og:image"
      content="https://YOUR-DOMAIN.com/social-preview.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Slugline baseball scoreboard and matchup dashboard"
    />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Slugline" />
    <meta
      name="twitter:description"
      content="Scores, matchups, teams and player stats in one clean baseball dashboard."
    />
    <meta
      name="twitter:image"
      content="https://YOUR-DOMAIN.com/social-preview.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="Slugline baseball scoreboard and matchup dashboard"
    />

    <script type="module" src="/src/main.tsx"></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
